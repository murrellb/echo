<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071012">
  <meta name="description" content="Blockfall Duel — a two-player peer-to-peer falling-block browser game.">
  <title>Blockfall Duel</title>
  <style>:root {
  --ink: #f5f7ec;
  --muted: #8e9a9b;
  --panel: #111719;
  --panel-2: #182023;
  --line: #2b383b;
  --acid: #d7ff36;
  --cyan: #36e4ff;
  --orange: #ff7b2c;
  --red: #ff3f58;
  --shadow: #030708;
  --background: #071012;
  --foreground: var(--ink);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--background);
  color: var(--foreground);
}

body {
  min-width: 320px;
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background:
    linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
    radial-gradient(circle at 15% 10%, #193f42 0, transparent 31%),
    #071012;
  background-size: 32px 32px, 32px 32px, auto, auto;
  color: var(--ink);
  font-family: "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

button:disabled {
  cursor: not-allowed;
}

.app-shell {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  isolation: isolate;
}

.app-shell::before {
  position: fixed;
  z-index: -3;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(7, 16, 18, 0.25), #071012 88%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(255, 255, 255, 0.012) 3px 4px);
  content: "";
  pointer-events: none;
}

.ambient {
  position: fixed;
  z-index: -2;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.13;
  pointer-events: none;
}

.ambient-one {
  top: 15%;
  left: -240px;
  background: var(--cyan);
}

.ambient-two {
  right: -260px;
  bottom: 0;
  background: var(--acid);
}

.topbar {
  position: relative;
  z-index: 30;
  display: flex;
  min-height: 68px;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px clamp(16px, 4vw, 54px);
  border-bottom: 1px solid #263237;
  background: rgba(7, 14, 16, 0.9);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
  backdrop-filter: blur(18px);
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  text-align: left;
}

.brand-lockup > span:last-child {
  display: grid;
  line-height: 1;
}

.brand-lockup strong {
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 0.07em;
}

.brand-lockup small {
  margin-top: 4px;
  color: var(--acid);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.24em;
}

.brand-mark {
  display: grid;
  width: 31px;
  height: 31px;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  filter: drop-shadow(0 0 9px rgba(215, 255, 54, 0.25));
}

.brand-mark i {
  display: block;
  border: 1px solid #71811f;
  background: linear-gradient(135deg, #f1ff88, var(--acid) 55%, #89a40d);
  box-shadow: inset 2px 2px rgba(255, 255, 255, 0.38), inset -2px -2px rgba(0, 0, 0, 0.34);
}

.brand-mark i:first-child {
  grid-column: 2;
}

.brand-mark i:nth-child(2) {
  grid-column: 1;
}

.topbar-actions,
.net-chip {
  display: flex;
  align-items: center;
}

.topbar-actions {
  gap: 10px;
}

.net-chip {
  gap: 7px;
  min-height: 34px;
  padding: 0 11px;
  border: 1px solid #2e4245;
  background: #101a1c;
  color: #b8cacb;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.net-chip svg {
  color: var(--acid);
}

.net-chip b {
  margin-left: 3px;
  color: var(--cyan);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px;
}

.net-chip--quiet {
  color: #8c9a9d;
}

.icon-button {
  display: inline-grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border: 1px solid #334144;
  border-radius: 3px;
  background: #121b1e;
  cursor: pointer;
  transition: 150ms ease;
}

.icon-button:hover {
  border-color: var(--cyan);
  color: var(--cyan);
  transform: translateY(-1px);
}

.menu-stage,
.lobby-stage,
.game-stage {
  position: relative;
  z-index: 1;
}

.menu-stage {
  display: grid;
  width: min(1180px, calc(100% - 40px));
  min-height: calc(100svh - 68px);
  margin: 0 auto;
  grid-template-columns: minmax(0, 1.2fr) minmax(340px, 0.8fr);
  align-items: center;
  gap: clamp(40px, 8vw, 110px);
  padding: 54px 0 70px;
}

.hero-copy {
  position: relative;
  min-width: 0;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 18px;
  color: var(--cyan);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.19em;
}

.hero-copy h1,
.lobby-heading h1 {
  margin: 0;
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  font-size: clamp(64px, 8.5vw, 126px);
  font-weight: 900;
  letter-spacing: -0.025em;
  line-height: 0.79;
  text-wrap: balance;
}

.hero-copy h1 span {
  display: block;
  color: var(--acid);
  text-shadow: 0 5px 0 #586810, 0 12px 28px rgba(215, 255, 54, 0.18);
}

.hero-lede {
  max-width: 610px;
  margin: 28px 0 0;
  color: #aebbbc;
  font-size: clamp(17px, 2vw, 21px);
  line-height: 1.55;
}

.feature-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 18px 25px;
  margin-top: 28px;
}

.feature-strip span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #d4dede;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.feature-strip svg {
  color: var(--acid);
}

.hero-art {
  position: relative;
  width: min(560px, 84%);
  height: 205px;
  margin: 38px auto -20px;
  perspective: 900px;
}

.hero-stack {
  position: absolute;
  bottom: 15px;
  display: grid;
  width: 175px;
  height: 115px;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  transform-style: preserve-3d;
}

.stack-a {
  left: 4%;
  transform: rotateX(60deg) rotateZ(-18deg);
}

.stack-b {
  right: 4%;
  transform: rotateX(60deg) rotateZ(18deg);
}

.hero-stack i {
  border: 1px solid rgba(255, 255, 255, 0.28);
  box-shadow:
    inset 9px 9px 15px rgba(255, 255, 255, 0.19),
    inset -10px -10px 15px rgba(0, 0, 0, 0.3),
    8px 11px 0 rgba(0, 0, 0, 0.24);
}

.versus-burst {
  position: absolute;
  z-index: 2;
  top: 53px;
  left: 50%;
  color: var(--ink);
  font-family: Impact, sans-serif;
  font-size: 45px;
  font-style: italic;
  text-shadow: 4px 4px 0 var(--red);
  transform: translateX(-50%) rotate(-6deg);
}

.falling-cube {
  position: absolute;
  width: 30px;
  height: 30px;
  box-shadow:
    inset 5px 5px rgba(255, 255, 255, 0.24),
    inset -5px -5px rgba(0, 0, 0, 0.3),
    0 8px 12px rgba(0, 0, 0, 0.35);
  animation: hero-fall 1.9s ease-in infinite;
}

.cube-one {
  top: 3px;
  left: 25%;
}

.cube-two {
  top: -22px;
  right: 28%;
  animation-delay: -0.8s;
}

.cube-three {
  top: 17px;
  left: 54%;
  animation-delay: -1.35s;
}

@keyframes hero-fall {
  0% {
    opacity: 0;
    transform: translateY(-40px) rotate(0);
  }
  20% {
    opacity: 1;
  }
  85% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translateY(125px) rotate(130deg);
  }
}

.menu-console,
.room-share-card,
.roster-card,
.chat-card {
  border: 1px solid #314145;
  background:
    linear-gradient(145deg, rgba(255, 255, 255, 0.025), transparent 38%),
    rgba(15, 22, 24, 0.95);
  box-shadow: 12px 16px 0 rgba(0, 0, 0, 0.2), 0 30px 80px rgba(0, 0, 0, 0.24);
}

.menu-console {
  position: relative;
  padding: clamp(24px, 4vw, 38px);
}

.menu-console::before,
.room-share-card::before,
.chat-card::before {
  position: absolute;
  top: -1px;
  left: -1px;
  width: 56px;
  height: 3px;
  background: var(--acid);
  box-shadow: 56px 0 var(--cyan);
  content: "";
}

.console-header,
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.console-header {
  margin-bottom: 28px;
  padding-bottom: 15px;
  border-bottom: 1px solid #273438;
  color: #dce4e2;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.14em;
}

.console-header span,
.section-title > span {
  display: inline-flex;
  align-items: center;
  gap: 9px;
}

.console-header svg,
.section-title svg {
  color: var(--acid);
}

.console-header i {
  color: #59696c;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 10px;
  font-style: normal;
}

.field-label {
  display: block;
  margin: 18px 0 7px;
  color: #89999c;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.text-field {
  width: 100%;
  height: 49px;
  padding: 0 14px;
  border: 1px solid #344448;
  border-radius: 2px;
  background: #091113;
  color: var(--ink);
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
  font-size: 16px;
  font-weight: 700;
}

.text-field::placeholder {
  color: #4b5a5d;
}

.room-code-input {
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 14px;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.primary-button,
.secondary-button,
.ready-button,
.practice-button,
.link-button,
.leave-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 0;
  cursor: pointer;
  font-size: 12px;
  font-weight: 950;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: 150ms ease;
}

.primary-button {
  min-height: 52px;
  padding: 0 17px;
  background: var(--acid);
  color: #111704;
  box-shadow: 0 6px 0 #687d0e, 0 12px 22px rgba(0, 0, 0, 0.28);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}

.primary-button:hover:not(:disabled) {
  filter: brightness(1.1);
  transform: translateY(-2px);
  box-shadow: 0 8px 0 #687d0e, 0 16px 25px rgba(0, 0, 0, 0.32);
}

.primary-button:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #687d0e;
}

.primary-button:disabled {
  background: #364044;
  color: #718083;
  box-shadow: 0 5px 0 #22292b;
  opacity: 0.75;
}

.create-button {
  width: 100%;
  margin-top: 15px;
}

.create-button svg:last-child {
  margin-left: auto;
}

.secondary-button {
  min-height: 49px;
  padding: 0 20px;
  border: 1px solid #516064;
  background: #1a2427;
  color: #eff5f3;
  box-shadow: 0 4px 0 #080d0e;
}

.secondary-button:hover {
  border-color: var(--cyan);
  color: var(--cyan);
}

.or-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 30px 0 2px;
  color: #5b6a6d;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.15em;
}

.or-divider::before,
.or-divider::after {
  height: 1px;
  flex: 1;
  background: #273336;
  content: "";
}

.join-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 9px;
}

.practice-button,
.link-button,
.leave-button {
  background: transparent;
  color: #9eadaf;
}

.practice-button {
  width: 100%;
  margin-top: 24px;
  padding: 7px;
}

.practice-button:hover,
.link-button:hover,
.leave-button:hover {
  color: var(--cyan);
}

.connection-message {
  margin: 19px 0 0;
  color: #526164;
  font-size: 10px;
  line-height: 1.4;
  text-align: center;
}

.connection-message span {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 6px;
  border-radius: 50%;
  background: #405055;
}

.connection-message.is-active {
  color: #89989b;
}

.connection-message.is-active span {
  background: var(--acid);
  box-shadow: 0 0 7px var(--acid);
}

/* Lobby */

.lobby-stage {
  width: min(1120px, calc(100% - 40px));
  min-height: calc(100svh - 68px);
  margin: 0 auto;
  padding: clamp(38px, 6vw, 70px) 0 60px;
}

.lobby-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 30px;
}

.lobby-heading .eyebrow {
  margin-bottom: 10px;
}

.lobby-heading h1 {
  font-size: clamp(50px, 7vw, 86px);
  line-height: 0.9;
}

.lobby-heading p:not(.eyebrow) {
  margin: 12px 0 0;
  color: #8e9c9f;
  font-size: 15px;
}

.leave-button {
  padding: 9px 0;
  white-space: nowrap;
}

.lobby-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 330px;
  gap: 18px;
}

.lobby-main {
  display: grid;
  gap: 18px;
}

.room-share-card,
.roster-card,
.chat-card {
  position: relative;
  padding: 24px;
}

.section-title {
  margin-bottom: 19px;
  color: #dce4e2;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 0.15em;
}

.section-title small {
  color: #6f7d80;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px;
}

.live-dot {
  color: var(--acid);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px;
}

.live-dot::before {
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 6px;
  border-radius: 50%;
  background: var(--acid);
  box-shadow: 0 0 8px var(--acid);
  content: "";
}

.room-code-display {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 65px;
  gap: 15px;
  padding: 10px 13px 10px 19px;
  border: 1px dashed #415357;
  background: #081012;
}

.room-code-display code {
  color: var(--acid);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: clamp(18px, 4vw, 27px);
  font-weight: 900;
  letter-spacing: 0.18em;
  text-shadow: 0 0 16px rgba(215, 255, 54, 0.24);
}

.link-button {
  margin-top: 13px;
  padding: 4px 0;
  font-size: 10px;
}

.roster-list {
  display: grid;
  gap: 10px;
}

.player-badge,
.empty-player {
  display: flex;
  min-height: 74px;
  align-items: center;
  gap: 13px;
  padding: 11px 13px;
  border: 1px solid #29383b;
  background: #0b1315;
}

.player-badge.is-ready {
  border-color: rgba(215, 255, 54, 0.48);
  background: linear-gradient(90deg, rgba(215, 255, 54, 0.075), #0b1315 45%);
}

.avatar-cube {
  display: grid;
  width: 45px;
  height: 45px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid #4f676b;
  background: linear-gradient(135deg, #2d4a50, #142a2e);
  box-shadow: inset 5px 5px rgba(255, 255, 255, 0.05), inset -5px -5px rgba(0, 0, 0, 0.22);
  color: var(--cyan);
  font-family: Impact, sans-serif;
  font-size: 20px;
}

.player-copy {
  min-width: 0;
  flex: 1;
}

.player-name-line {
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-name-line strong {
  overflow: hidden;
  font-size: 15px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.you-tag {
  padding: 2px 4px;
  background: var(--cyan);
  color: #061113;
  font-size: 7px;
  font-weight: 950;
  letter-spacing: 0.1em;
}

.player-meta {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 5px;
  color: #738285;
  font-size: 10px;
  text-transform: capitalize;
}

.player-meta svg {
  color: var(--acid);
}

.ready-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 7px;
  border: 1px solid #354245;
  color: #687679;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ready-pill.is-on {
  border-color: #7c941e;
  background: rgba(215, 255, 54, 0.08);
  color: var(--acid);
}

.empty-player {
  border-style: dashed;
  color: #637275;
}

.empty-player strong,
.empty-player small {
  display: block;
}

.empty-player strong {
  color: #91a0a3;
  font-size: 13px;
}

.empty-player small {
  margin-top: 4px;
  font-size: 10px;
}

.scan-ring {
  position: relative;
  display: block;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  border: 1px solid #405155;
  border-radius: 50%;
}

.scan-ring::before {
  position: absolute;
  inset: 5px;
  border: 1px solid var(--cyan);
  border-color: var(--cyan) transparent;
  border-radius: 50%;
  animation: scan 1.4s linear infinite;
  content: "";
}

@keyframes scan {
  to {
    transform: rotate(360deg);
  }
}

.lobby-actions {
  display: grid;
  grid-template-columns: 1fr 1.25fr;
  gap: 12px;
}

.ready-button {
  min-height: 58px;
  border: 1px solid #4f6064;
  background: #172124;
  color: #dbe3e1;
  box-shadow: 0 5px 0 #070b0c;
}

.ready-button:hover,
.ready-button.is-ready {
  border-color: var(--cyan);
  color: var(--cyan);
}

.ready-button.is-ready {
  background: rgba(54, 228, 255, 0.08);
}

.start-button {
  min-height: 58px;
}

.host-wait {
  display: flex;
  min-height: 58px;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border: 1px dashed #3b4b4e;
  color: #7d8b8e;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-align: center;
  text-transform: uppercase;
}

.host-wait svg {
  color: var(--acid);
}

.host-warning {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 0;
  color: #6e7d80;
  font-size: 10px;
}

.host-warning svg {
  color: var(--orange);
}

.chat-card {
  display: flex;
  min-height: 510px;
  flex-direction: column;
}

.chat-feed {
  display: flex;
  min-height: 250px;
  max-height: 320px;
  flex: 1;
  flex-direction: column;
  gap: 9px;
  overflow-y: auto;
  padding-right: 4px;
}

.chat-empty {
  display: grid;
  min-height: 190px;
  place-content: center;
  color: #5d6b6e;
  text-align: center;
}

.chat-empty span {
  color: #849295;
  font-size: 12px;
}

.chat-empty small {
  margin-top: 5px;
  font-size: 9px;
}

.chat-line {
  align-self: flex-start;
  max-width: 88%;
}

.chat-line strong {
  color: var(--cyan);
  font-size: 9px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.chat-line p {
  margin: 4px 0 0;
  padding: 8px 10px;
  border: 1px solid #2b3b3e;
  background: #0a1214;
  color: #c1cdcd;
  font-size: 12px;
  line-height: 1.35;
}

.chat-line.is-mine {
  align-self: flex-end;
  text-align: right;
}

.chat-line.is-mine strong {
  color: var(--acid);
}

.chat-line.is-mine p {
  background: rgba(215, 255, 54, 0.055);
}

.chat-form {
  display: grid;
  grid-template-columns: 1fr 42px;
  margin-top: 12px;
  border: 1px solid #344448;
  background: #091113;
}

.chat-form input {
  min-width: 0;
  height: 43px;
  padding: 0 11px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
}

.chat-form button {
  display: grid;
  place-items: center;
  border: 0;
  background: var(--acid);
  color: #101505;
  cursor: pointer;
}

.network-readout {
  margin-top: 17px;
  padding-top: 14px;
  border-top: 1px solid #273438;
}

.network-readout > div {
  display: flex;
  align-items: center;
  gap: 8px;
}

.network-readout strong {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.network-readout p {
  margin: 5px 0 0 30px;
  color: #657477;
  font-size: 9px;
  line-height: 1.4;
}

.signal-pips {
  display: flex;
  height: 14px;
  align-items: flex-end;
  gap: 2px;
}

.signal-pips i {
  width: 4px;
  background: var(--acid);
}

.signal-pips i:first-child {
  height: 5px;
}

.signal-pips i:nth-child(2) {
  height: 9px;
}

.signal-pips i:last-child {
  height: 14px;
}

/* Game */

.game-stage {
  width: 100%;
  min-height: calc(100svh - 68px);
  padding: 12px clamp(12px, 2vw, 28px) 16px;
}

.game-hud {
  display: grid;
  width: min(1110px, 100%);
  min-height: 42px;
  margin: 0 auto 10px;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 18px;
  border-bottom: 1px solid #243235;
  color: #7d8c8f;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
}

.round-tag,
.hud-network {
  display: flex;
  align-items: center;
  gap: 8px;
}

.round-tag strong {
  color: var(--acid);
}

.round-tag span {
  padding: 3px 5px;
  background: #253033;
}

.hud-versus {
  display: flex;
  min-width: 290px;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: #d1dada;
  font-family: Impact, sans-serif;
  font-size: 14px;
  letter-spacing: 0.05em;
}

.hud-versus b {
  color: var(--red);
  font-size: 18px;
  font-style: italic;
}

.hud-network {
  justify-self: end;
  color: var(--cyan);
}

.arena {
  display: grid;
  width: min(1110px, 100%);
  margin: 0 auto;
  grid-template-columns: minmax(150px, 210px) minmax(270px, 390px) minmax(175px, 255px);
  align-items: start;
  justify-content: center;
  gap: clamp(14px, 2.5vw, 34px);
}

.stats-rail,
.opponent-rail {
  display: grid;
  gap: 12px;
  padding-top: 29px;
}

.stat-card,
.next-card,
.desktop-controls,
.opponent-card,
.rain-rule {
  border: 1px solid #29383b;
  background: rgba(14, 21, 23, 0.9);
  box-shadow: 6px 8px 0 rgba(0, 0, 0, 0.16);
}

.stat-card {
  padding: 12px;
}

.stat-card span,
.next-card > span,
.desktop-controls > span,
.board-label,
.opponent-head span {
  color: #718083;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

.stat-card strong {
  display: block;
  margin-top: 4px;
  color: var(--ink);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 25px;
  line-height: 1;
}

.stat-card--score {
  border-left: 3px solid var(--acid);
}

.stat-card--score strong {
  color: var(--acid);
  font-size: clamp(19px, 2.3vw, 29px);
  text-shadow: 0 0 12px rgba(215, 255, 54, 0.18);
}

.stat-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.next-card {
  padding: 13px;
}

.next-card > div {
  margin-top: 6px;
  padding: 3px 0;
  border-top: 1px solid #253033;
  opacity: 0.45;
  transform: scale(0.82);
  transform-origin: left center;
}

.next-card > div.is-primary {
  margin-top: 10px;
  border: 0;
  opacity: 1;
  transform: none;
}

.piece-preview {
  display: grid;
  width: 80px;
  height: 58px;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 2px;
}

.preview-cell {
  display: block;
}

.preview-cell[class*="piece-"] {
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.38), var(--piece-color) 38%, color-mix(in srgb, var(--piece-color), #000 35%));
  box-shadow: inset -3px -3px rgba(0, 0, 0, 0.25);
}

.desktop-controls {
  padding: 13px;
}

.desktop-controls p {
  margin: 9px 0 0;
  color: #829194;
  font-size: 9px;
  letter-spacing: 0.05em;
}

kbd {
  display: inline-grid;
  min-width: 22px;
  min-height: 20px;
  margin-right: 3px;
  padding: 2px 4px;
  place-items: center;
  border: 1px solid #4b5b5e;
  border-bottom-width: 3px;
  background: #182124;
  color: #d8e0df;
  font-family: inherit;
  font-size: 8px;
}

.main-board-column {
  min-width: 0;
}

.board-label {
  display: flex;
  min-height: 25px;
  align-items: center;
  justify-content: space-between;
}

.board-label i {
  color: var(--acid);
  font-style: normal;
}

.board-label i::before {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin-right: 5px;
  border-radius: 50%;
  background: var(--acid);
  box-shadow: 0 0 6px var(--acid);
  content: "";
}

.danger-readout {
  color: var(--red);
  animation: danger-pulse 0.45s ease-in-out infinite alternate;
}

@keyframes danger-pulse {
  to {
    text-shadow: 0 0 12px var(--red);
  }
}

.board-shell {
  position: relative;
  width: min(41vh, 390px);
  max-width: 100%;
  aspect-ratio: 1 / 2;
  margin: 0 auto;
  padding: 7px;
  border: 1px solid #3e5054;
  background: linear-gradient(145deg, #36474a, #11191b 20%, #0a1012 78%, #2d3a3d);
  box-shadow:
    0 2px 0 #56676a inset,
    0 -5px 0 #050809 inset,
    12px 16px 0 rgba(0, 0, 0, 0.28),
    0 22px 60px rgba(0, 0, 0, 0.38);
  transform: perspective(1100px) rotateX(1.8deg) rotateY(-1deg);
  transform-origin: center bottom;
}

.board-rim {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: 2px solid #05090a;
  background: #071012;
  box-shadow:
    inset 0 0 25px rgba(0, 0, 0, 0.9),
    inset 0 0 0 1px rgba(255, 255, 255, 0.04);
}

.board-grid {
  display: grid;
  width: 100%;
  height: 100%;
  grid-template-columns: repeat(10, 1fr);
  grid-template-rows: repeat(20, 1fr);
}

.block-cell {
  position: relative;
  min-width: 0;
  min-height: 0;
  border: 1px solid rgba(88, 115, 118, 0.085);
  background: rgba(12, 24, 26, 0.48);
}

.block-cell[class*="piece-"] {
  z-index: 2;
  border-color: color-mix(in srgb, var(--piece-color), white 22%);
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.52) 0 7%, transparent 8%),
    linear-gradient(145deg, color-mix(in srgb, var(--piece-color), white 20%), var(--piece-color) 42%, color-mix(in srgb, var(--piece-color), #000 39%));
  box-shadow:
    inset 3px 3px 0 rgba(255, 255, 255, 0.18),
    inset -4px -4px 0 rgba(0, 0, 0, 0.25),
    0 0 7px color-mix(in srgb, var(--piece-color), transparent 45%);
}

.block-cell[class*="piece-"]::after {
  position: absolute;
  inset: 24%;
  border: 1px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.04);
  content: "";
}

.block-cell.is-ghost {
  border: 1px solid color-mix(in srgb, var(--piece-color), transparent 18%);
  background: color-mix(in srgb, var(--piece-color), transparent 86%);
  box-shadow: inset 0 0 5px color-mix(in srgb, var(--piece-color), transparent 55%);
}

.block-cell.is-ghost::after {
  display: none;
}

.piece-I {
  --piece-color: #2de2ef;
}

.piece-J {
  --piece-color: #5574ff;
}

.piece-L {
  --piece-color: #ff8a2b;
}

.piece-O {
  --piece-color: #f5d92f;
}

.piece-S {
  --piece-color: #4ed35c;
}

.piece-T {
  --piece-color: #bd62f4;
}

.piece-Z {
  --piece-color: #ff445f;
}

.piece-G {
  --piece-color: #ff2d74;
}

.block-cell.piece-G {
  border-color: #ff9cbc;
  background:
    repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0 4px, transparent 4px 8px),
    linear-gradient(145deg, #ff78a6, #ff2d74 46%, #791739);
  box-shadow:
    inset 3px 3px 0 rgba(255, 255, 255, 0.24),
    inset -4px -4px 0 rgba(56, 0, 24, 0.38),
    0 0 11px rgba(255, 45, 116, 0.74);
}

.block-cell.piece-G::after {
  inset: 28%;
  border-color: #ffd5e3;
  background: #3a071b;
  box-shadow: 0 0 4px #fff;
  transform: rotate(45deg);
}

.board-glare {
  position: absolute;
  z-index: 5;
  inset: 0;
  background: linear-gradient(115deg, rgba(255, 255, 255, 0.045), transparent 28% 71%, rgba(255, 255, 255, 0.025));
  pointer-events: none;
}

.opponent-card {
  position: relative;
  padding: 13px;
}

.opponent-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 11px;
}

.opponent-head span,
.opponent-head strong {
  display: block;
}

.opponent-head strong {
  max-width: 150px;
  margin-top: 3px;
  overflow: hidden;
  color: #e2e9e7;
  font-size: 13px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.opponent-head i {
  display: block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #536164;
}

.opponent-head i.is-online {
  background: var(--acid);
  box-shadow: 0 0 8px var(--acid);
}

.board-shell--mini {
  width: min(19vh, 148px);
  padding: 4px;
  box-shadow: 7px 9px 0 rgba(0, 0, 0, 0.22);
  transform: none;
}

.board-shell--mini .block-cell {
  border-width: 0.5px;
}

.board-shell--mini .block-cell[class*="piece-"] {
  box-shadow: inset 1px 1px rgba(255, 255, 255, 0.2), inset -2px -2px rgba(0, 0, 0, 0.25);
}

.board-shell--mini .block-cell::after {
  display: none;
}

.opponent-board-hit {
  animation: board-hit 0.16s linear 4;
}

@keyframes board-hit {
  50% {
    filter: brightness(1.7) saturate(1.4);
    transform: translateX(3px);
  }
}

.opponent-score {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  color: #728083;
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 7px;
  letter-spacing: 0.08em;
}

.opponent-score b {
  color: #c8d2d0;
}

.attack-flash {
  position: absolute;
  z-index: 8;
  right: 8px;
  bottom: 35px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 8px;
  background: var(--red);
  color: white;
  font-size: 9px;
  font-weight: 950;
  letter-spacing: 0.08em;
  animation: attack-pop 0.22s ease-out;
}

@keyframes attack-pop {
  from {
    opacity: 0;
    transform: scale(1.4) rotate(-4deg);
  }
}

.rain-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
}

.rain-rule-icon {
  display: grid;
  width: 37px;
  height: 37px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid #596267;
  background: linear-gradient(145deg, #455052, #20282a);
  color: var(--red);
}

.rain-rule strong {
  color: #dbe2e0;
  font-size: 9px;
  letter-spacing: 0.1em;
}

.rain-rule p {
  margin: 3px 0 0;
  color: #728083;
  font-size: 9px;
  line-height: 1.35;
}

.touch-controls {
  display: none;
}

.match-overlay {
  position: fixed;
  z-index: 40;
  inset: 68px 0 0;
  display: grid;
  place-content: center;
  background: rgba(3, 8, 9, 0.76);
  backdrop-filter: blur(8px);
  text-align: center;
}

.match-overlay p {
  margin: 0;
  color: var(--cyan);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.22em;
}

.match-overlay > strong {
  margin-top: 8px;
  color: var(--acid);
  font-family: Impact, sans-serif;
  font-size: clamp(92px, 20vw, 220px);
  font-style: italic;
  line-height: 0.9;
  text-shadow: 8px 9px 0 #596c0c, 0 0 50px rgba(215, 255, 54, 0.28);
}

.match-overlay > span {
  margin-top: 20px;
  color: #98a6a8;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.result-overlay > strong {
  font-size: clamp(66px, 13vw, 145px);
}

.result-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  margin-top: 32px;
}

.result-actions .primary-button {
  min-width: 210px;
}

.result-actions .secondary-button {
  min-width: 100px;
}

.toast {
  position: fixed;
  z-index: 80;
  top: 84px;
  left: 50%;
  display: flex;
  min-height: 42px;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  border: 1px solid #849c18;
  background: #182008;
  box-shadow: 0 8px 0 rgba(0, 0, 0, 0.28), 0 0 24px rgba(215, 255, 54, 0.14);
  color: var(--acid);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.1em;
  transform: translateX(-50%);
  animation: toast-in 0.25s ease-out;
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translate(-50%, -20px);
  }
}

@media (max-width: 860px) {
  .menu-stage {
    grid-template-columns: 1fr;
    gap: 44px;
    padding-top: 44px;
  }

  .hero-copy {
    text-align: center;
  }

  .eyebrow,
  .feature-strip {
    justify-content: center;
  }

  .hero-lede {
    margin-right: auto;
    margin-left: auto;
  }

  .menu-console {
    width: min(500px, 100%);
    margin: 0 auto;
  }

  .lobby-grid {
    grid-template-columns: 1fr;
  }

  .chat-card {
    min-height: 390px;
  }

  .chat-feed {
    min-height: 170px;
    max-height: 230px;
  }

  .arena {
    grid-template-columns: minmax(120px, 175px) minmax(250px, 360px);
  }

  .opponent-rail {
    position: absolute;
    top: 62px;
    right: 14px;
    width: 150px;
    padding: 0;
  }

  .opponent-card {
    padding: 8px;
  }

  .board-shell--mini {
    width: 105px;
  }

  .rain-rule {
    display: none;
  }
}

@media (max-width: 640px) {
  body {
    overscroll-behavior: none;
  }

  .topbar {
    min-height: 56px;
    padding: 8px 12px;
  }

  .brand-mark {
    width: 26px;
    height: 26px;
  }

  .brand-lockup strong {
    font-size: 15px;
  }

  .brand-lockup small {
    font-size: 6px;
  }

  .net-chip {
    min-height: 32px;
    padding: 0 8px;
    font-size: 8px;
  }

  .net-chip b,
  .net-chip--quiet span {
    display: none;
  }

  .topbar-actions {
    gap: 6px;
  }

  .icon-button {
    width: 33px;
    height: 33px;
  }

  .menu-stage {
    width: min(100% - 24px, 500px);
    min-height: calc(100svh - 56px);
    gap: 26px;
    padding: 32px 0 42px;
  }

  .hero-copy h1 {
    font-size: clamp(54px, 18vw, 78px);
  }

  .hero-lede {
    margin-top: 20px;
    font-size: 15px;
  }

  .feature-strip {
    gap: 12px 16px;
    margin-top: 20px;
  }

  .feature-strip span {
    font-size: 8px;
  }

  .hero-art {
    display: none;
  }

  .menu-console {
    padding: 22px 18px 24px;
  }

  .lobby-stage {
    width: min(100% - 24px, 520px);
    min-height: calc(100svh - 56px);
    padding: 27px 0 40px;
  }

  .lobby-heading {
    align-items: flex-start;
    margin-bottom: 22px;
  }

  .lobby-heading h1 {
    font-size: 48px;
  }

  .lobby-heading p:not(.eyebrow) {
    display: none;
  }

  .leave-button {
    font-size: 0;
  }

  .leave-button svg {
    width: 20px;
    height: 20px;
  }

  .room-share-card,
  .roster-card,
  .chat-card {
    padding: 18px;
  }

  .room-code-display {
    min-height: 57px;
    padding-left: 13px;
  }

  .room-code-display code {
    font-size: clamp(15px, 5vw, 22px);
    letter-spacing: 0.11em;
  }

  .lobby-actions {
    grid-template-columns: 1fr;
  }

  .game-stage {
    min-height: calc(100svh - 56px);
    padding: 4px 8px max(94px, calc(env(safe-area-inset-bottom) + 84px));
  }

  .game-hud {
    min-height: 36px;
    margin-bottom: 4px;
    grid-template-columns: 1fr auto;
  }

  .round-tag {
    display: none;
  }

  .hud-versus {
    min-width: 0;
    justify-content: flex-start;
    gap: 8px;
    font-size: 10px;
  }

  .hud-versus b {
    font-size: 13px;
  }

  .hud-network {
    font-size: 7px;
  }

  .arena {
    display: grid;
    width: 100%;
    grid-template-columns: 55px minmax(230px, 320px) 55px;
    gap: 5px;
  }

  .stats-rail {
    padding-top: 22px;
    gap: 5px;
  }

  .stat-card {
    padding: 7px 4px;
    text-align: center;
  }

  .stat-card span {
    font-size: 5px;
    letter-spacing: 0.08em;
  }

  .stat-card strong,
  .stat-card--score strong {
    margin-top: 3px;
    font-size: 11px;
  }

  .stat-card--score {
    border-left-width: 1px;
  }

  .stat-pair {
    grid-template-columns: 1fr;
    gap: 5px;
  }

  .next-card {
    padding: 6px 3px;
    overflow: hidden;
  }

  .next-card > span {
    display: block;
    font-size: 5px;
    text-align: center;
  }

  .next-card > div:not(.is-primary) {
    display: none;
  }

  .piece-preview {
    width: 47px;
    height: 35px;
    margin: 0 auto;
    gap: 1px;
  }

  .desktop-controls {
    display: none;
  }

  .board-label {
    min-height: 22px;
    padding: 0 2px;
    font-size: 6px;
  }

  .board-shell {
    width: min(63vh, calc(100vw - 126px));
    padding: 4px;
    box-shadow: 7px 9px 0 rgba(0, 0, 0, 0.27);
    transform: none;
  }

  .block-cell[class*="piece-"] {
    box-shadow:
      inset 2px 2px 0 rgba(255, 255, 255, 0.18),
      inset -3px -3px 0 rgba(0, 0, 0, 0.25),
      0 0 4px color-mix(in srgb, var(--piece-color), transparent 45%);
  }

  .block-cell[class*="piece-"]::after {
    inset: 28%;
  }

  .opponent-rail {
    position: static;
    width: auto;
    padding-top: 22px;
  }

  .opponent-card {
    padding: 4px;
  }

  .opponent-head {
    margin-bottom: 5px;
  }

  .opponent-head span {
    display: none;
  }

  .opponent-head strong {
    max-width: 44px;
    margin: 0;
    font-size: 7px;
    text-align: center;
  }

  .opponent-head i {
    display: none;
  }

  .board-shell--mini {
    width: 48px;
    padding: 2px;
    box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.25);
  }

  .opponent-score {
    display: grid;
    gap: 2px;
    margin-top: 5px;
    font-size: 5px;
    text-align: center;
  }

  .attack-flash {
    right: 0;
    bottom: 18px;
    padding: 3px;
    font-size: 5px;
  }

  .attack-flash svg {
    display: none;
  }

  .touch-controls {
    position: fixed;
    z-index: 25;
    right: 0;
    bottom: 0;
    left: 0;
    display: grid;
    height: max(82px, calc(env(safe-area-inset-bottom) + 74px));
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    padding: 5px 6px max(6px, env(safe-area-inset-bottom));
    border-top: 1px solid #354447;
    background: rgba(7, 13, 15, 0.95);
    box-shadow: 0 -14px 35px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(15px);
  }

  .touch-controls button {
    display: grid;
    min-width: 0;
    place-content: center;
    gap: 2px;
    border: 1px solid #354447;
    border-bottom: 4px solid #1c2729;
    border-radius: 3px;
    background: linear-gradient(#1c292c, #11191b);
    color: #b9c6c6;
    touch-action: none;
    user-select: none;
  }

  .touch-controls button:active {
    border-bottom-width: 1px;
    background: #233336;
    color: var(--cyan);
    transform: translateY(3px);
  }

  .touch-controls svg {
    width: 22px;
    height: 22px;
    margin: auto;
  }

  .touch-controls span {
    font-size: 6px;
    font-weight: 900;
    letter-spacing: 0.08em;
  }

  .touch-controls .drop-button {
    border-color: #708519;
    border-bottom-color: #4f600b;
    background: linear-gradient(#dfff56, var(--acid));
    color: #101505;
  }

  .match-overlay {
    inset: 56px 0 0;
  }

  .match-overlay > strong {
    font-size: 100px;
  }

  .result-overlay > strong {
    padding: 0 12px;
    font-size: 62px;
  }

  .result-actions {
    width: min(330px, calc(100vw - 30px));
    margin-right: auto;
    margin-left: auto;
    flex-direction: column;
  }

  .result-actions .primary-button,
  .result-actions .secondary-button {
    width: 100%;
  }

  .toast {
    top: 67px;
    max-width: calc(100% - 24px);
    white-space: nowrap;
  }
}

@media (max-width: 380px) {
  .arena {
    grid-template-columns: 45px minmax(210px, 1fr) 45px;
  }

  .board-shell {
    width: min(61vh, calc(100vw - 108px));
  }

  .opponent-card {
    border: 0;
    background: transparent;
    box-shadow: none;
  }

  .board-shell--mini {
    width: 41px;
  }

  .hero-copy h1 {
    font-size: 50px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
</style>
